[workspace]
resolver = "3"
members = [
    "crates/ritornel-contract",
    "crates/ritornel-domain",
    "crates/ritornel-engine",
    "crates/ritornel-client",
    "apps/server",
    "apps/ritornelctl",
]
# The lab material holds Cargo workspaces of its own and is never built
# from here.
exclude = ["bakeoff", "prototypes", "spikes"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

# Dependencies point one way: contract <- domain <- engine <- server, and
# contract <- client <- each client program. `scripts/check-deps.sh` enforces
# it. See decision 8 in docs/design/server.md.
[workspace.dependencies]
ritornel-contract = { path = "crates/ritornel-contract" }
ritornel-domain = { path = "crates/ritornel-domain" }
ritornel-engine = { path = "crates/ritornel-engine" }
ritornel-client = { path = "crates/ritornel-client" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
todo = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
