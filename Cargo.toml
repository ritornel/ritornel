[workspace]
resolver = "3"
members = [
    "crates/ritornel-build",
    "crates/ritornel-contract",
    "crates/ritornel-domain",
    "crates/ritornel-engine",
    "crates/ritornel-client",
    "crates/ritornel-source",
    "crates/ritornel-lastfm",
    "crates/ritornel-musicbrainz",
    "crates/ritornel-windows",
    "apps/server",
    "apps/ritornelctl",
]
# The desktop app (apps/desktop) is never built from here: it is built with
# GPUI, which the hub's Linux build must not need, so it is a workspace of
# its own with tasks of its own in mise.toml.
exclude = ["apps/desktop"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# Dependencies point one way: contract <- domain <- engine <- server, and
# contract <- client <- each client program. A plugin stands beside them:
# source <- engine, and source <- each plugin <- server, and no plugin
# depends on the engine. `scripts/check-deps.py` enforces it. See "Workspace and tooling" in docs/internals/server.md.
[workspace.dependencies]
ritornel-build = { path = "crates/ritornel-build" }
ritornel-contract = { path = "crates/ritornel-contract" }
ritornel-domain = { path = "crates/ritornel-domain" }
ritornel-engine = { path = "crates/ritornel-engine" }
ritornel-client = { path = "crates/ritornel-client" }
ritornel-source = { path = "crates/ritornel-source" }
ritornel-lastfm = { path = "crates/ritornel-lastfm" }
ritornel-musicbrainz = { path = "crates/ritornel-musicbrainz" }
ritornel-windows = { path = "crates/ritornel-windows" }
# The Last.fm crate that `ritornel-lastfm` stands on: sign-in, a
# history read with every page checked, loved tracks and scrobbling. Pinned
# exactly. Before 1.0 a minor release may add or break, and a patch fixes.
scrobl = "=0.3.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
todo = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"

# Many tests invent a library first, and drawing and encoding its covers
# unoptimised took most of the time the tests run. The drawing is in the
# engine, so it and the image crate it encodes with are optimised even in a
# debug build: inventing is six times faster, and the engine takes a little
# longer to compile.
[profile.dev.package.ritornel-engine]
opt-level = 1

[profile.dev.package.image]
opt-level = 3
