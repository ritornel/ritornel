[workspace]
resolver = "3"
members = [
    "crates/ritornel-contract",
    "crates/ritornel-domain",
    "crates/ritornel-engine",
    "crates/ritornel-client",
    "crates/ritornel-source",
    "crates/ritornel-lastfm",
    "apps/server",
    "apps/ritornelctl",
]
# The lab material holds Cargo workspaces of its own and is never built
# from here. Neither is the desktop app's shell: it is built with Tauri,
# which needs WebKit and GTK libraries that the hub's Linux build must not,
# so it is a workspace of its own (apps/desktop/src-tauri/Cargo.toml) with
# tasks of its own in mise.toml.
exclude = ["bakeoff", "prototypes", "spikes", "apps/desktop"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

# Dependencies point one way: contract <- domain <- engine <- server, and
# contract <- client <- each client program. A plugin stands beside them:
# source <- engine, and source <- each plugin <- server, and no plugin
# depends on the engine. `scripts/check-deps.sh` enforces it. See decision 8 in docs/design/server.md.
[workspace.dependencies]
ritornel-contract = { path = "crates/ritornel-contract" }
ritornel-domain = { path = "crates/ritornel-domain" }
ritornel-engine = { path = "crates/ritornel-engine" }
ritornel-client = { path = "crates/ritornel-client" }
ritornel-source = { path = "crates/ritornel-source" }
ritornel-lastfm = { path = "crates/ritornel-lastfm" }
# The owner's Last.fm crate, which `ritornel-lastfm` stands on: sign-in, a
# history read with every page checked, loved tracks and scrobbling. Pinned
# exactly. Before 1.0 a minor release may add or break, and a patch fixes.
scrobl = "=0.3.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
todo = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
