[package]
name = "ritornelctl"
description = "Command-line client, and the first consumer of the contract."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[build-dependencies]
ritornel-build.workspace = true

[dependencies]
ritornel-client.workspace = true
# Parses the command line. The help it prints and the messages for a wrong
# command line are this program's own, so clap's colours, suggestions and
# usage lines are left out. `help` is what gives it a --help flag at all, and
# `error-context` says which option an error is about.
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "error-context"] }
# `--json` prints what the server sent as JSON. It also parses Spotify's
# history, whose rows are read field by field through serde.
serde_json = { version = "1.0.154", features = ["raw_value"] }
serde = "1.0.229"
# Reads the time each Spotify stream ended, and prints its day.
jiff = { version = "=0.2.43", default-features = false, features = ["std"] }
# Reads the zip file Spotify sends where it is, without unpacking it. Only
# what its history files use: deflate, with the Rust zlib.
zip = { version = "9.8.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# The runtime the client's connection runs on. One thread is enough for a
# command that makes a call and exits.
tokio = { version = "1.54.1", features = ["rt", "time"] }

[dev-dependencies]
# A folder of its own for each test, named at random and created only if
# it is new, so no test finds another's.
tempfile = "3.27.0"
# The fake Last.fm the test of the `lastfm` commands runs the server
# against. A dev-dependency: the program itself links nothing of Last.fm.
ritornel-lastfm = { workspace = true, features = ["fake"] }

[lints]
workspace = true
