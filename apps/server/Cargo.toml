[package]
name = "ritornel-server"
description = "The server: config, lock, listener, and routing from contract calls to engine methods."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["audio-output", "lastfm", "media-session", "musicbrainz"]
# The system's audio output, through the engine: CoreAudio on macOS,
# WASAPI on Windows, and ALSA on Linux, where it needs ALSA's development
# files to build. The
# headless hub is built without it, links no audio library, and has no
# player unless `--output null` asks for one. See docs/internals/platforms.md.
audio-output = ["ritornel-engine/audio-output"]
# Last.fm: the import of a history, loved tracks, and scrobbling, through
# `ritornel-lastfm`. A server built without it links no Last.fm code, and
# CI builds it both ways. See docs/internals/plugins.md.
lastfm = ["dep:ritornel-lastfm"]
# MusicBrainz: asking it about the library's discs, through
# `ritornel-musicbrainz`, once the library's switch allows it. The hub is
# built with it and without the other default features, and still links no
# system library. See "MusicBrainz lookups" in docs/internals/corrections.md.
musicbrainz = ["dep:ritornel-musicbrainz"]
# The system's media session: Now Playing and the media keys on macOS,
# with `main` blocking in the platform run loop, MPRIS on the session bus
# on Linux, and the system's media transport controls on Windows. The hub is built without it. See "OS integration" in
# docs/internals/playback.md.
media-session = ["dep:souvlaki", "dep:objc2-core-foundation", "dep:zbus", "ritornel-windows/media"]

[dependencies]
# A satellite talks to its hub as any client does: the descriptor, the
# socket and the routes, through the same client.
ritornel-client.workspace = true
ritornel-contract.workspace = true
ritornel-engine = { workspace = true, default-features = false }
ritornel-lastfm = { workspace = true, optional = true }
ritornel-musicbrainz = { workspace = true, optional = true }
ritornel-source.workspace = true
# Sends a master to a satellite as it is read, as a stream of chunks. It
# is already in the lock file, under the client.
futures-util = { version = "0.3.34", default-features = false }
# The listener: HTTP routing and the WebSocket upgrade, over hyper and
# tungstenite. Only what a loopback HTTP/1 listener needs is switched on.
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "ws"] }
# Parses the command line. The help it prints and the messages for a wrong
# command line are this program's own, so clap's colours, suggestions and
# usage lines are left out. `help` is what gives it a --help flag at all, and
# `error-context` says which option an error is about.
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "error-context"] }
# Serves each connection, so that the listener can bound how many it serves
# and how long each may take to send a request. axum is built on both, so
# neither adds to the lock file.
hyper = { version = "1.12.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["service", "tokio"] }
# Compares a presented credential with the server's own in constant time.
# It is already in the lock file, under the engine's signing key.
subtle = "2.6.1"
# Watches the hub's folders: FSEvents on macOS and inotify on Linux, neither
# of which needs a library installed. Pinned exactly, as its events are what a
# rescan waits on.
notify = { version = "=8.2.2", default-features = false, features = ["macos_fsevent"] }
# `config.toml` and `server.json` are read and written through it.
serde = { version = "1.0.229", features = ["derive"] }
# `server.json`, the text of each log line, and the bodies of the HTTP routes.
serde_json = "1.0.154"
# The async runtime the listener runs on. It also catches SIGINT and SIGTERM,
# which the standard library cannot do without unsafe code.
tokio = { version = "1.54.1", features = ["fs","io-util","macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
# `config.toml`.
toml = { version = "1.2.1", default-features = false, features = ["std", "parse", "serde"] }
# What log lines are written through, here and in the libraries to come.
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
# This machine's addresses on a tailnet, which an invite offers. The
# standard library cannot list a machine's addresses.
if-addrs = "0.15.0"
# Stages a background service's definition: on Unix a replacement for the
# unit or agent, beside it, and on Windows the task schtasks reads.
tempfile = "3.27.0"

# Free disk space, for `server.status`, and the user ID that names the
# login session the background service runs in. The standard library cannot
# ask for either without unsafe code.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", features = ["fs", "process"] }

# The same on Windows, and what Windows has in place of the rest of Unix: a
# lock on one byte, owner-only access lists, a folder's identity, and the
# hidden window that hears `taskkill` and the end of the session.
[target.'cfg(windows)'.dependencies]
ritornel-windows.workspace = true

# The media session on macOS: souvlaki for Now Playing and the remote
# commands, and Core Foundation's run loop for the main thread, which objc2
# wraps with no unsafe code of ours.
[target.'cfg(target_os = "macos")'.dependencies]
souvlaki = { version = "=0.9.3", default-features = false, optional = true }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFRunLoop"], optional = true }

# MPRIS on Linux: the player as `org.mpris.MediaPlayer2.ritornel` on the
# session bus, served from the server's own async runtime. zbus is pure
# Rust, so it needs no libdbus. Pinned exactly: it is the whole adapter.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "=6.3.0", default-features = false, features = ["tokio", "service"], optional = true }

[dev-dependencies]
# Tests of waits run on paused time, which moves only while every task waits.
tokio = { version = "1.54.1", features = ["test-util"] }
# The fake Last.fm the Last.fm tests run against.
ritornel-lastfm = { workspace = true, features = ["fake"] }
# The fake MusicBrainz the lookup tests run against.
ritornel-musicbrainz = { workspace = true, features = ["fake"] }
# The contract tests talk to a server through the client, as every program
# does.
ritornel-client.workspace = true
# The contract tests that the client cannot make: a socket upgrade with no
# credential, or with an `Origin`, and a message over the limit.
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
tokio-tungstenite = "0.29.0"
# To leave a library as an older build would have: in rollback-journal
# mode, a migration behind.
rusqlite = { version = "=0.42.0", default-features = false, features = ["bundled"] }

# The MPRIS tests' bus: the player and a bus that stops reading, as two
# ends of one socket.
[target.'cfg(target_os = "linux")'.dev-dependencies]
zbus = { version = "=6.3.0", default-features = false, features = ["tokio", "service", "p2p"] }

[lints]
workspace = true
