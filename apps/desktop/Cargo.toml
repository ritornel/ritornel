# The desktop app, in GPUI. It is a Cargo workspace of its own, so that GPUI
# reaches neither the main workspace's build nor its lock file; the main
# workspace excludes `apps/desktop`. It depends on the contract and the
# client, as every client program does, and on nothing of the engine
# (scripts/check-deps.sh). See docs/internals/desktop.md.
[package]
name = "ritornel-desktop-gpui"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[[bin]]
name = "ritornel-gpui"
path = "src/main.rs"

[dependencies]
ritornel-client = { path = "../../crates/ritornel-client" }
ritornel-contract = { path = "../../crates/ritornel-contract" }

# GPUI: a weekly snapshot of Zed's in-tree GPUI (zed@125ca86). The crates.io
# `gpui` (0.2.2, October 2025) is a year behind Zed. The pin follows the
# snapshots week by week rather than drifting, each move a change of its own.
gpui = { package = "gpui-pre", version = "=0.3.13" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.13", default-features = false, features = ["font-kit"] }

# The connection runs on Tokio, as ritornel-client's does; covers come over
# HTTP from the server on the same runtime.
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
hyper = { version = "=1.12.0", features = ["client", "http1"] }
hyper-util = { version = "=0.1.21", features = ["tokio"] }
http-body-util = "=0.1.5"
futures = "=0.3.34"
image = { version = "=0.25.10", default-features = false, features = ["jpeg"] }
serde_json = "=1.0.154"
# Folding names as the server does, for type-to-find's lozenge (`find.rs`).
unicode-normalization = "=0.1.25"
# Word and character boundaries in the search field (`input.rs`).
unicode-segmentation = "=1.13.3"
# Dates and times in the system's zone, and the zones a person may choose,
# for Settings (`settings/words.rs`), as the engine reads them.
jiff = "=0.2.43"

[target.'cfg(target_os = "macos")'.dependencies]
# The system's own context menu: an NSMenu popped up over GPUI's view.
objc2 = "=0.6.5"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSArray", "NSGeometry", "NSLocale", "NSString", "NSObject", "NSRunLoop", "NSURL", "objc2-core-foundation", "block2"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSView", "NSResponder", "NSMenu", "NSMenuItem", "NSCell", "NSEvent", "NSWindow", "NSApplication", "NSWorkspace", "NSAccessibility", "NSAppearance", "NSOpenPanel", "NSPanel", "NSSavePanel", "objc2-core-foundation", "block2"] }
block2 = "=0.6.2"
raw-window-handle = "=0.6.2"
libc = "=0.2.191"

[target.'cfg(target_os = "linux")'.dependencies]
# GPUI's Wayland and X11 backends, on Linux alone: without one it has no
# window to open. Cargo adds these features to the declaration above.
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.13", default-features = false, features = ["font-kit", "wayland", "x11"] }
# The server the app starts, in a session of its own, and Quit's signal to
# it (`platform/linux.rs`).
libc = "=0.2.191"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
raw-window-handle = "=0.6.2"

[features]
# Compile GPUI's Metal shaders at launch, so that only the Command Line
# Tools are needed to build ("Workspace and server connection" in
# docs/internals/desktop.md).
default = ["runtime-shaders"]
runtime-shaders = ["gpui_platform/runtime_shaders"]

[workspace]

[lints.rust]
# AppKit, Win32 and Linux's process calls are reached through `unsafe` in
# `platform/`, each allowed where it is used.
unsafe_code = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
todo = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"

[profile.release]
codegen-units = 1
lto = "thin"
debug = "line-tables-only"
