[package]
name = "ritornel-engine"
description = "Both stores, migrations, writers, jobs, outbox, scanner, playback and sync."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Async admission and shared results for the dedicated transcode threads.
tokio = { version = "1.54.1", features = ["sync", "time", "macros"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
# Private staging for seekable encoder output.
tempfile = "3.27.0"
# The public ID type: an ID is what a client sees, so the contract owns it.
ritornel-contract.workspace = true
ritornel-domain.workspace = true
# What a history source hands over: import records, a cursor and loves.
ritornel-source.workspace = true
# The audio hash, and the hash a payload and a picture are known by. Pinned
# exactly because the hash is a stored key.
blake3 = "=1.8.7"
# The zone this server is in, by its IANA name, captured on every listen.
# The domain reads local dates with the same crate; this side only asks the
# system for its zone.
jiff = { version = "=0.2.43", default-features = false, features = ["std", "tz-system"] }
# The Ed25519 key pair that is half of a server's identity.
ed25519-dalek = "3.0.0"
# The operating system's random numbers, for IDs, keys and tokens.
getrandom = "0.4.3"
# Pinned exactly, because the SQLite it bundles is the one the server asserts
# at startup. See "SQLite" in docs/internals/server.md.
# `cache` is its prepared-statement cache: a scan runs the same few inserts
# for every file, and without it each would be parsed again every time.
rusqlite = { version = "=0.42.0", default-features = false, features = ["bundled", "cache", "functions"] }
# The ring between the decode thread and the output, which the output's
# real-time callback reads without locking or allocating. See "Audio pipeline"
# in docs/internals/playback.md.
rtrb = "=0.4.1"
# Resampling a track to the output's rate, with the fixed-ratio FFT
# resampler ("Audio pipeline" in docs/internals/playback.md). Pinned exactly:
# three major versions came out in four months.
rubato = "=5.1.0"
# A stored payload, a decision's evidence and a job's checkpoint are JSON.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# SHA-256, for migration checksums and for the hash kept of a session token.
sha2 = "0.11.1"
# Demuxes a file without decoding it and reads its tags and pictures. Pinned
# exactly: scheme 1 is defined as what this version's demuxers deliver, and
# a fixture test fails if an upgrade moves any hash. The decoders it brings
# are what the player needs.
symphonia = { version = "=0.6.1", features = ["all"] }
# Covers: decodes the JPEG or PNG a picture is stored as, scales it to a
# served size and writes it as a JPEG. Only the two formats covers come in.
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png"] }
# Decomposes text so that a list can be ordered and searched ignoring accents.
# The version the domain's normaliser pins.
unicode-normalization = "=0.1.25"
# Writes projected tags and pictures into a staged audio copy.
lofty = "=0.25.5"

# The monotonic clock that keeps counting while the machine sleeps, which
# every listen is stamped with: the standard library's does not on macOS.
# The server builds it already. `fs` opens a picture folder's files one
# component at a time, following no link and waiting on no pipe.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", features = ["fs", "time"] }

# The same on Windows, where the standard library cannot ask: the time
# since boot, a folder's volume and file index, and where an open file
# really is.
[target.'cfg(windows)'.dependencies]
ritornel-windows.workspace = true
# cpal's own thread, which WASAPI wakes every few milliseconds for the next
# frames, joins the system's audio scheduling (MMCSS) through `realtime`: at
# normal priority it wakes late whenever every core is busy, and the sound
# drops out. CoreAudio's threads are real-time already. See
# docs/internals/platforms.md, "Windows".
cpal = { version = "=0.18.2", optional = true, features = ["realtime"] }

# The system's audio output: CoreAudio on macOS, WASAPI on Windows, and ALSA
# on Linux, which reaches PipeWire and PulseAudio through their ALSA
# plugins. On Linux cpal links libasound, so a build with the feature needs
# ALSA's development files (alsa-lib, or libasound2-dev); WASAPI is part of
# Windows and needs nothing installed. The headless hub is built without it
# and links no audio library. See docs/internals/platforms.md.
[target.'cfg(any(target_os = "macos", target_os = "linux", windows))'.dependencies]
cpal = { version = "=0.18.2", optional = true }

[features]
default = ["audio-output"]
# Plays through the system's default output where the platform has one
# (macOS, Linux and Windows). Without it, a server can still play into the null
# output, which discards what it is given.
audio-output = ["dep:cpal"]

[target.'cfg(unix)'.dev-dependencies]
# Verify that a cancelled encoder has been reaped by its parent.
rustix = { version = "1.1.6", features = ["process"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt"] }

[lints]
workspace = true
