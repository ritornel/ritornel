[package]
name = "ritornel-contract"
description = "Wire types: calls, events, errors and public IDs."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
# Every wire type is read and written through it.
serde = { version = "1.0.229", features = ["derive"] }
# A JSON-RPC frame carries params and a result of any shape, so a frame holds
# a JSON value until the method says what type it is.
serde_json = "1.0.154"

[dev-dependencies]
# Writes each wire type as TypeScript from its serde attributes, for
# contract/contract.ts. Only this crate's tests build it: no program does.
ts-rs = { version = "12.0.1", features = ["serde-json-impl"] }

[lints]
workspace = true
