[package]
name = "ritornel-musicbrainz"
description = "MusicBrainz as a catalogue: asks it about a disc and hands the reply over as it came."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# A fake MusicBrainz on a loopback socket, for the tests of this crate and
# of the server. Nothing else turns it on.
fake = []

[dependencies]
ritornel-source.workspace = true
# The HTTP client, with rustls, so the hub that carries this plugin still
# links no system library. scrobl already builds this version.
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls"] }
# reqwest's client is async. This crate runs it on a runtime of its own,
# so that its callers stay synchronous.
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
# A test's address is parsed to be sure it is on loopback. reqwest builds
# this version.
url = "2.5.8"

[lints]
workspace = true
