name: Set up
description: >-
  The setup every CI job shares, after the checkout: the system packages a
  Linux job links, the tools mise.toml pins, the Rust that
  rust-toolchain.toml names, and the Rust build cache.

inputs:
  packages:
    description: Debian packages to install, space-separated. Linux only.
    default: ''
  workspaces:
    description: The Cargo workspaces whose builds are cached, one per line, as Swatinem/rust-cache takes them.
    default: .
  disable-tools:
    description: >-
      The tools of mise.toml not to install, as MISE_DISABLE_TOOLS takes
      them. A tool no step uses is not installed: ffmpeg alone is some
      ninety conda packages, and the fixtures it made are committed, so it
      comes off this list with the first step that needs it.
    default: conda:ffmpeg,aqua:EmbarkStudios/cargo-deny
  rust-cache:
    description: >-
      The Rust build cache the job uses. `own` restores the job's cache and,
      on main, saves it. `crates` keeps only the crates downloaded, for a job
      that rebuilds quickly enough to be worth no build cache. `none` skips
      rust-cache altogether, for jobs that compile nothing.
    default: own
  shared-key:
    description: >-
      Optional shared cache key passed to Swatinem/rust-cache (for example
      `workspace` or `desktop-release`). Empty uses the job id.
    default: ''

runs:
  using: composite
  steps:
    # In the job's environment, so that a later `mise run` does not install
    # them either.
    - shell: bash
      env:
        TOOLS: ${{ inputs.disable-tools }}
      run: echo "MISE_DISABLE_TOOLS=$TOOLS" >> "$GITHUB_ENV"
    - if: runner.os == 'Linux' && inputs.packages != ''
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
      run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends $PACKAGES
    # Only main saves caches, so that PRs restore from it and do not fill
    # the repository's cache quota, 10 GB, which evicts the least recently
    # used when it is full.
    - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
      with:
        cache_save: ${{ github.ref == 'refs/heads/main' }}
    - if: inputs.rust-cache != 'none'
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        workspaces: ${{ inputs.workspaces }}
        shared-key: ${{ inputs.shared-key }}
        cache-targets: ${{ inputs.rust-cache != 'crates' }}
        save-if: ${{ github.ref == 'refs/heads/main' }}
