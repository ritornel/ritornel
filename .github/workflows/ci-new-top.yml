name: CI on a new top layer

# A layer under the top of a stack runs CI on Linux alone (see the changes
# job in ci.yml). When the pull request above it closes without merging, or
# moves to another base, nothing is pushed to the layer, so this runs the
# layer's CI again, which now finds it on top and runs every system. A pull
# request that merges into the layer under it pushes to that layer, which
# starts its CI, and a stack that merges into main lands whole.
#
# pull_request_target, because GitHub starts no pull_request workflow for a
# pull request with merge conflicts, as an abandoned layer often has. It is
# safe here: this checks out nothing, takes the branch name through the
# environment, and acts only on a pull request from this repository.
on:
  pull_request_target:
    types: [closed, edited]

permissions: {}

jobs:
  rerun:
    name: Run CI again on the layer below
    if: >-
      !github.event.pull_request.merged &&
      (github.event.action == 'closed' || github.event.changes.base.ref.from) &&
      (github.event.changes.base.ref.from || github.event.pull_request.base.ref) != github.event.repository.default_branch &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-slim
    timeout-minutes: 15
    # Two pull requests above one layer that close together rerun it once.
    concurrency:
      group: ci-new-top-${{ github.event.changes.base.ref.from || github.event.pull_request.base.ref }}
      cancel-in-progress: true
    permissions:
      actions: write
      pull-requests: read
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # The branch the pull request was based on: before a move, its old base.
          BASE: ${{ github.event.changes.base.ref.from || github.event.pull_request.base.ref }}
        run: |
          # The open pull request from that branch, and the commit it is at.
          head_of() {
            gh api --method GET "repos/$GH_REPO/pulls" -f state=open -f head="${GH_REPO%%/*}:$BASE" \
              --jq '.[0] // empty | "\(.number) \(.head.sha)"'
          }
          pr=$(head_of)
          if [[ -z $pr ]]; then
            echo "No open pull request comes from $BASE."
            exit 0
          fi
          read -r below sha <<<"$pr"
          # A pull request from a fork does not land through the one it is based on.
          above=$(gh api --method GET "repos/$GH_REPO/pulls" -f state=open -f base="$BASE" -F per_page=100 \
            --jq 'map(select(.head.repo.full_name == .base.repo.full_name)) | length')
          if ((above > 0)); then
            echo "#$below is still the base of $above open pull request(s), so its tier is unchanged."
            exit 0
          fi
          run=$(gh run list --workflow ci.yml --event pull_request --commit "$sha" --limit 1 \
            --json databaseId --jq '.[0].databaseId // empty')
          if [[ -z $run ]]; then
            echo "#$below has no CI run at $sha to run again."
            exit 0
          fi
          status() { gh run view "$run" --json status --jq .status; }
          if [[ $(status) != completed ]]; then
            gh run cancel "$run" || true
            for _ in $(seq 60); do
              [[ $(status) == completed ]] && break
              sleep 5
            done
          fi
          # A push since then started a run of its own, which has the full tier.
          now=$(head_of)
          if [[ ${now#* } != "$sha" ]]; then
            echo "#$below has moved on from $sha, and its new commit's CI runs every system."
            exit 0
          fi
          for _ in 1 2 3; do
            if gh run rerun "$run"; then
              echo "#$below is the top of its stack now: CI run $run runs again with the full tier." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          exit 1
