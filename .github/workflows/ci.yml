name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a PR cancels its older run. Each run on main has a group of
# its own, so none is cancelled or held back, and main's caches always save.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Debug builds keep line numbers for backtraces and no more, which makes
  # them, their link and the cache smaller.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  NEXTEST_PROFILE: ci

# Every PR runs a fast `checks` job and one job per system (`linux`, `macos`,
# `windows`), unless every file changed since merge-base(origin/main, HEAD) is
# documentation or a licence file. Release desktop builds, the arm64 player,
# and cache pruning run after merge on `push: main`.
jobs:
  checks:
    name: Formatting, dependencies, test sleeps, docs and licences
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    outputs:
      docs_only: ${{ steps.docs_only.outputs.docs_only }}
    steps:
      # Full history, so both the cumulative docs-only check and the contract
      # check find where a pull request (stacked or standalone) leaves main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          disable-tools: conda:ffmpeg,aqua:nextest-rs/nextest/cargo-nextest
          rust-cache: none
      # Skip the three OS jobs only for a PR whose cumulative changes since
      # origin/main are strictly documentation or licence files. A push to main
      # always runs every job so its caches stay warm. Uses NUL-delimited raw
      # paths and fails closed on empty diffs or git errors.
      - id: docs_only
        run: |
          set -euo pipefail
          if [[ $GITHUB_EVENT_NAME == pull_request ]]; then
            git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          fi
          python3 - <<'PY'
          import os, re, subprocess

          event = os.environ.get("GITHUB_EVENT_NAME", "")
          docs_only = False
          base = ""
          if event == "pull_request":
              base = subprocess.check_output(
                  ["git", "merge-base", "origin/main", "HEAD"], text=True
              ).strip()
              raw = subprocess.check_output(
                  ["git", "diff", "-z", "--name-only", "--no-renames", base, "HEAD"]
              )
              paths = [p.decode("utf-8", errors="surrogateescape") for p in raw.split(b"\0") if p]
              doc_re = re.compile(r"^(?:docs/.*|[^/]*\.md|LICENSE|LICENSES/.*)\Z", re.DOTALL)
              docs_only = bool(paths) and all(
                  ("\n" not in p and "\r" not in p) and doc_re.match(p) is not None
                  for p in paths
              )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"docs_only={'true' if docs_only else 'false'}\n")
          if docs_only:
              msg = f"Docs-only change since {base}: skipping platform builds.\n"
              print(msg, end="")
              summary = os.environ.get("GITHUB_STEP_SUMMARY")
              if summary:
                  with open(summary, "a", encoding="utf-8") as out:
                      out.write(msg)
          PY
      - run: mise run fmt
      - run: mise run deps
      - run: mise run sleeps
      # A pull request's contract version is checked against main's, where the
      # pull request leaves it. origin/main was fetched in the step above.
      - if: github.event_name == 'pull_request'
        run: mise run contract-version
      - run: scripts/check-docs.sh
      - run: mise run licenses

  linux:
    name: Linux
    needs: checks
    if: needs.checks.outputs.docs_only != 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          packages: pkg-config libasound2-dev libfontconfig-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev
          workspaces: |
            .
            apps/desktop
          shared-key: platform-debug
      - name: Workspace lint
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Server feature-variant lint
        run: |
          cargo clippy --locked --package ritornel-server --no-default-features --features musicbrainz --all-targets -- -D warnings
          cargo clippy --locked --package ritornel-server --no-default-features --all-targets -- -D warnings
          cargo clippy --locked --package ritornel-server --no-default-features --features audio-output --all-targets -- -D warnings
      - name: Workspace rustdoc
        run: mise run rustdoc
      # Build test binaries first, then run them, so compile and test timings
      # appear as separate steps (cargo-nextest has no --no-build flag; the
      # second call reuses the fresh build without recompiling).
      - name: Build workspace tests
        run: cargo nextest run --locked --workspace --all-features --no-run
      - name: Run workspace tests
        run: cargo nextest run --locked --workspace --all-features
      - name: Workspace doc tests
        run: cargo test --locked --workspace --all-features --doc
      # The headless hub, as built for a Linux machine with no desktop:
      # PKG_CONFIG_LIBDIR=/nonexistent blocks pkg-config discovery of system
      # libraries (ALSA and desktop libraries among them) so any crate that
      # probes for them through pkg-config fails the build.
      - name: Hub without pkg-config system libraries
        env:
          PKG_CONFIG_LIBDIR: /nonexistent
          PKG_CONFIG_PATH: ''
        run: |
          cargo nextest run --locked --package ritornel-server --no-default-features --features musicbrainz
          cargo test --locked --package ritornel-server --no-default-features --features musicbrainz --doc
      - name: Desktop debug check
        run: mise run desktop:check

  macos:
    name: macOS
    needs: checks
    if: needs.checks.outputs.docs_only != 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          workspaces: |
            .
            apps/desktop
          shared-key: platform-debug
      - name: Workspace lint
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Workspace rustdoc
        run: mise run rustdoc
      - name: Build workspace tests
        run: cargo nextest run --locked --workspace --all-features --no-run
      - name: Run workspace tests
        run: cargo nextest run --locked --workspace --all-features
      - name: Desktop debug check
        run: mise run desktop:check

  windows:
    name: Windows
    needs: checks
    if: needs.checks.outputs.docs_only != 'true'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          workspaces: |
            .
            apps/desktop
          shared-key: platform-debug
      - name: Workspace lint
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Workspace rustdoc
        run: mise run rustdoc
      - name: Build workspace tests
        run: cargo nextest run --locked --workspace --all-features --no-run
      - name: Run workspace tests
        run: cargo nextest run --locked --workspace --all-features
      - name: Desktop debug check
        run: mise run desktop:check

  passed:
    # The single check for branch protection to require: passes only when
    # `checks` succeeded and either all three OS jobs individually succeeded or
    # the PR was strictly docs-only. Skipped on cancelled runs so a superseded
    # push does not mark a commit failed.
    name: CI passed
    if: ${{ !cancelled() }}
    needs: [checks, linux, macos, windows]
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - if: >-
          needs.checks.result != 'success' ||
          (
            !(github.event_name == 'pull_request' && needs.checks.outputs.docs_only == 'true') &&
            (needs.linux.result != 'success' || needs.macos.result != 'success' || needs.windows.result != 'success')
          ) ||
          contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

  desktop-release:
    # Post-merge release build of the desktop app (thin LTO, single CGU) on
    # each system, using its own cache key so PRs never download release
    # artifacts.
    name: Desktop release on ${{ matrix.name }}
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-26.04
          - name: macOS
            runner: macos-latest
          - name: Windows
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          packages: >-
            ${{ matrix.name == 'Linux' && 'pkg-config libfontconfig-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev' || '' }}
          workspaces: apps/desktop
          shared-key: desktop-release
          disable-tools: conda:ffmpeg,aqua:EmbarkStudios/cargo-deny,aqua:nextest-rs/nextest/cargo-nextest
      - run: mise run desktop:release

  player-arm64:
    # Post-merge native arm64 build, tests, release build, and footprint check
    # for the headless player (audio-output alone, linking ALSA).
    name: Player on arm64 Linux
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          packages: pkg-config libasound2-dev
          rust-cache: crates
      - run: cargo clippy --locked --package ritornel-server --no-default-features --features audio-output --all-targets -- -D warnings
      - run: cargo nextest run --locked --package ritornel-engine --package ritornel-server --no-default-features --features ritornel-server/audio-output
      - run: cargo test --locked --package ritornel-engine --package ritornel-server --no-default-features --features ritornel-server/audio-output --doc
      - run: cargo build --locked --release --package ritornel-server --no-default-features --features audio-output
      - run: cargo build --locked --release --package ritornelctl
      - run: scripts/player-footprint.sh target/release

  prune-caches:
    # On main, once every job has saved its cache: deletes each cache on main
    # that a newer one of the same kind replaced, such as the whole set saved
    # before Cargo.lock last changed. A PR restores the newest of a kind
    # when its own key is not found, so nothing restores the older ones, and
    # left to the quota they would evict newer caches instead.
    name: Prune replaced caches
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    needs: [checks, linux, macos, windows, desktop-release, player-arm64]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          declare -A kept
          gh api --paginate "repos/$GH_REPO/actions/caches?ref=refs/heads/main&per_page=100" \
            --jq '.actions_caches[] | "\(.created_at) \(.id) \(.key)"' |
            sort -r |
            while read -r created id key; do
              # The key without the hashes at its end: the kind of cache.
              kind=$(sed -E 's/(-p[0-9]+)?(-[0-9a-f]{8,})+$//' <<<"$key")
              if [[ -n ${kept[$kind]:-} ]]; then
                echo "deleting $key, saved $created: ${kept[$kind]} replaced it"
                gh api --method DELETE "repos/$GH_REPO/actions/caches/$id" > /dev/null
              else
                kept[$kind]=$key
              fi
            done
