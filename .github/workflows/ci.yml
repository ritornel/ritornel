name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a PR cancels its older run. Each run on main has a group of
# its own, so none is cancelled or held back, and main's caches always save.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# The jobs together run what `mise run check` runs, each part where it can
# fail: what is the same on every system once, and what differs by system on
# each. The setup they share is .github/actions/setup.
jobs:
  checks:
    name: Formatting, dependencies, docs and licences
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rustdoc runs the build scripts, and cpal's asks for ALSA.
      - uses: ./.github/actions/setup
        with:
          packages: libasound2-dev
          disable-tools: conda:ffmpeg
      - run: mise run fmt
      - run: mise run deps
      - run: mise run docs
      - run: mise run licenses

  workspace:
    # Clippy, rustdoc's links and the tests of the main workspace, on each
    # system its code differs for. On Linux the server's audio output links ALSA, so that
    # job installs ALSA's development files; the hub job proves the hub
    # needs none.
    name: Workspace on ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, os: ubuntu-26.04, packages: libasound2-dev }
          - { name: macOS, os: macos-latest }
          - { name: Windows, os: windows-latest }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          packages: ${{ matrix.packages }}
      - run: mise run lint
      # The checks job runs it on Linux, with the rest of `mise run docs`.
      - if: runner.os != 'Linux'
        run: mise run rustdoc
      - run: mise run test

  desktop:
    # The desktop app, a workspace of its own, checked, linted, tested and
    # built in release on each system. On Linux GPUI's Wayland and X11
    # backends link fontconfig, xcb and xkbcommon; scripts/desktop.sh skips
    # without them, and fails instead in CI, so the job cannot pass by
    # skipping. On Windows the task runs scripts/desktop.ps1.
    name: Desktop app on ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-26.04
            packages: pkg-config libfontconfig-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev
          - { name: macOS, os: macos-latest }
          - { name: Windows, os: windows-latest }
    runs-on: ${{ matrix.os }}
    # It compiles GPUI twice: for clippy and the tests, and in release.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          packages: ${{ matrix.packages }}
          workspaces: apps/desktop
      - run: mise run desktop:check

  hub:
    # The headless hub, as it is built for a Linux machine with no desktop:
    # the server without its default features, so no audio output, media
    # session or Last.fm. pkg-config is pointed at nothing, so any crate
    # that would link a system library (ALSA among them) fails the build.
    # `mise run lint` lints it.
    name: Hub on Linux, linking no system library
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      PKG_CONFIG_LIBDIR: /nonexistent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: cargo test --locked --package ritornel-server --no-default-features

  player-arm64:
    # The headless player, as it is built for a small arm64 board: the
    # server with its audio output alone, which links ALSA, and no media
    # session or Last.fm. GitHub's arm64 runner builds it natively, which is
    # simpler than cross-linking ALSA, and runs the engine's and the
    # server's tests on arm64. The last step prints the release build's
    # size and the server's memory at idle.
    name: Player on arm64 Linux
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          packages: pkg-config libasound2-dev
      - run: cargo clippy --locked --package ritornel-server --no-default-features --features audio-output --all-targets -- -D warnings
      - run: cargo test --locked --package ritornel-engine --package ritornel-server --no-default-features --features ritornel-server/audio-output
      - run: cargo build --locked --release --package ritornel-server --no-default-features --features audio-output
      - run: cargo build --locked --release --package ritornelctl
      - run: scripts/player-footprint.sh target/release

  passed:
    # The one check for branch protection to require: it passes only when
    # every job above passed, so it stays the same as jobs are added. A job
    # added above goes in this list too.
    name: CI passed
    if: always()
    needs: [checks, workspace, desktop, hub, player-arm64]
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
