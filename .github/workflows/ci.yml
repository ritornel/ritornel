name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    # The hub is Linux and the desktop is macOS, so both run everything they
    # build. The desktop app is built on macOS alone, and the Linux job
    # proves the hub builds with no desktop library installed.
    strategy:
      fail-fast: false
      matrix:
        os: [blacksmith-2vcpu-ubuntu-2604, blacksmith-6vcpu-macos-latest]
    runs-on: ${{ matrix.os }}
    # The macOS job compiles the desktop app's dependencies as well.
    timeout-minutes: 45
    env:
      # A tool no step uses is not installed: ffmpeg alone is some ninety
      # conda packages, and the fixtures it made are committed. It comes
      # off this list with the first step that needs it.
      MISE_DISABLE_TOOLS: conda:ffmpeg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs what mise.toml pins, and the Rust that rust-toolchain.toml
      # names.
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
      # The steps are the tasks behind `mise run check`, one each so a
      # failure names itself.
      - run: mise run fmt
      - run: mise run deps
      - run: mise run licenses
      - run: mise run lint
      - run: mise run test
      - if: runner.os == 'macOS'
        run: mise run desktop:check
