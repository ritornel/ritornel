name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    # The hub is Linux and the desktop is macOS, so both run everything they
    # build. On Linux that includes the server's audio output, which links
    # ALSA, so the job installs ALSA's development files; the hub job below
    # proves the hub needs none. The desktop app is built here on macOS, and
    # on Linux in its own job, desktop-linux.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-latest]
    runs-on: ${{ matrix.os }}
    # The macOS job compiles the desktop app's dependencies as well.
    timeout-minutes: 45
    env:
      # A tool no step uses is not installed: ffmpeg alone is some ninety
      # conda packages, and the fixtures it made are committed. It comes
      # off this list with the first step that needs it.
      MISE_DISABLE_TOOLS: conda:ffmpeg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs what mise.toml pins, and the Rust that rust-toolchain.toml
      # names.
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
      # cpal's ALSA backend, for the server's audio output on Linux.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libasound2-dev
      # The steps are the tasks behind `mise run check`, one each so a
      # failure names itself.
      - run: mise run fmt
      - run: mise run deps
      - run: mise run licenses
      - run: mise run lint
      - run: mise run test
      - if: runner.os == 'macOS'
        run: mise run desktop:check

  hub:
    # The headless hub, as it is built for a Linux machine with no desktop:
    # the server without its default features, so no audio output, media
    # session or Last.fm. pkg-config is pointed at nothing, so any crate
    # that would link a system library (ALSA among them) fails the build.
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      MISE_DISABLE_TOOLS: conda:ffmpeg,node,pnpm
      PKG_CONFIG_LIBDIR: /nonexistent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
      - run: cargo clippy --locked --package ritornel-server --no-default-features --all-targets -- -D warnings
      - run: cargo test --locked --package ritornel-server --no-default-features

  desktop-linux:
    # The desktop app on Linux, with GPUI's Wayland and X11 backends, which
    # link fontconfig, xcb and xkbcommon. scripts/desktop.sh skips without
    # them, and fails instead in CI, so this job cannot pass by skipping.
    runs-on: ubuntu-26.04
    # It compiles GPUI twice: for clippy and the tests, and in release.
    timeout-minutes: 45
    env:
      MISE_DISABLE_TOOLS: conda:ffmpeg,node,pnpm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
      - run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends pkg-config libfontconfig-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev
      - run: mise run desktop:check
