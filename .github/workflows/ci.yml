name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a PR cancels its older run. Each run on main has a group of
# its own, so none is cancelled or held back, and main's caches always save.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Debug builds keep line numbers for backtraces and no more, which makes
  # them, their link and the cache smaller.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  NEXTEST_PROFILE: ci

# The jobs together run what `mise run check` runs, each part where it can
# fail: what is the same on every system once, and what differs by system on
# each. The setup they share is .github/actions/setup.
jobs:
  changes:
    # Which jobs a pull request's changes can affect, by scripts/ci-changes.sh:
    # one that touches only the desktop app skips the main workspace's jobs,
    # and one that touches only what the desktop app does not build skips
    # the desktop jobs. A push to main runs every job, so its caches are all
    # saved.
    #
    # And on which systems, by the tier. A pull request whose branch is the
    # base of another open one, a layer under the top of a stack, has the
    # Linux tier: the jobs on Linux x64 alone. Every other run has the full
    # tier, every system: a pull request on its own, the top of a stack,
    # which holds every layer under it and is where the stack lands, and a
    # push to main. When the pull requests cannot be listed, the tier is full.
    name: Jobs the change needs
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      workspace: ${{ steps.paths.outputs.workspace }}
      desktop: ${{ steps.paths.outputs.desktop }}
      tier: ${{ steps.tier.outputs.tier }}
      systems: ${{ steps.tier.outputs.systems }}
    steps:
      # What started the run, so a run started twice for one commit can be
      # told apart from the other.
      - env:
          ACTION: ${{ github.event.action }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: echo "event=$GITHUB_EVENT_NAME action=$ACTION before=$BEFORE after=$AFTER"
      # A pull request's run checks out its merge into the base branch, whose
      # first parent is the base: the two differ by what the pull request
      # changes. Without renames, a moved file is listed at both its paths.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: paths
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [[ $EVENT == pull_request ]]; then
            git diff --name-only --no-renames HEAD^1 HEAD | scripts/ci-changes.sh | tee -a "$GITHUB_OUTPUT"
          else
            printf 'workspace=true\ndesktop=true\n' | tee -a "$GITHUB_OUTPUT"
          fi
      - id: tier
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.head_ref }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tier=full
          if [[ $EVENT != pull_request ]]; then
            why="a push to $GITHUB_REF_NAME"
          elif [[ $HEAD_REPO != "$GH_REPO" ]]; then
            why="a pull request from another repository, which no other builds on"
          elif ! above=$(gh api --method GET "repos/$GH_REPO/pulls" -f state=open -f base="$HEAD_REF" -F per_page=100 \
            --jq 'map("#\(.number)") | join(", ")'); then
            why="the open pull requests could not be listed"
          elif [[ -n $above ]]; then
            tier=linux
            why="$HEAD_REF is the base of $above"
          else
            why="no open pull request is based on $HEAD_REF"
          fi
          if [[ $tier == linux ]]; then
            systems='["Linux"]'
          else
            systems='["Linux","macOS","Windows"]'
          fi
          printf 'tier=%s\nsystems=%s\n' "$tier" "$systems" | tee -a "$GITHUB_OUTPUT"
          echo "The $tier tier: $why." | tee -a "$GITHUB_STEP_SUMMARY"

  checks:
    name: Formatting, dependencies, test sleeps, docs and licences
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rustdoc runs the build scripts, and cpal's asks for ALSA.
      - uses: ./.github/actions/setup
        with:
          packages: libasound2-dev
          disable-tools: conda:ffmpeg,aqua:nextest-rs/nextest/cargo-nextest
          rust-cache: workspace
      - run: mise run fmt
      - run: mise run deps
      - run: mise run sleeps
      - run: mise run docs
      - run: mise run licenses

  workspace:
    # Clippy, rustdoc's links and the tests of the main workspace, on each
    # system its code differs for. On Linux the server's audio output links ALSA, so that
    # job installs ALSA's development files; the hub job proves the hub
    # needs none.
    name: Workspace on ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.workspace == 'true'
    strategy:
      fail-fast: false
      # The systems are the tier's, so a runner is named for each here
      # rather than in an include, which would add back a system the tier
      # leaves out.
      matrix:
        name: ${{ fromJSON(needs.changes.outputs.systems) }}
    runs-on: ${{ fromJSON('{"Linux":"ubuntu-26.04","macOS":"macos-latest","Windows":"windows-latest"}')[matrix.name] }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          packages: ${{ matrix.name == 'Linux' && 'libasound2-dev' || '' }}
      - run: mise run lint
      # The checks job runs it on Linux, with the rest of `mise run docs`.
      - if: runner.os != 'Linux'
        run: mise run rustdoc
      - run: mise run test

  desktop:
    # The desktop app, a workspace of its own, checked, linted, tested and
    # built in release on each system. On Linux GPUI's Wayland and X11
    # backends link fontconfig, xcb and xkbcommon; scripts/desktop.sh skips
    # without them, and fails instead in CI, so the job cannot pass by
    # skipping. On Windows the task runs scripts/desktop.ps1.
    name: Desktop app on ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJSON(needs.changes.outputs.systems) }}
    runs-on: ${{ fromJSON('{"Linux":"ubuntu-26.04","macOS":"macos-latest","Windows":"windows-latest"}')[matrix.name] }}
    # It compiles GPUI twice: for clippy and the tests, and in release.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          packages: >-
            ${{ matrix.name == 'Linux' && 'pkg-config libfontconfig-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev' || '' }}
          workspaces: apps/desktop
          disable-tools: conda:ffmpeg,aqua:EmbarkStudios/cargo-deny,aqua:nextest-rs/nextest/cargo-nextest
      - run: mise run desktop:check

  hub:
    # The headless hub, as it is built for a Linux machine with no desktop:
    # the server without its default features, so no audio output, media
    # session or Last.fm. pkg-config is pointed at nothing, so any crate
    # that would link a system library (ALSA among them) fails the build.
    # `mise run lint` lints it.
    name: Hub on Linux, linking no system library
    needs: changes
    if: needs.changes.outputs.workspace == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      PKG_CONFIG_LIBDIR: /nonexistent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          rust-cache: workspace
      - run: cargo nextest run --locked --package ritornel-server --no-default-features
      - run: cargo test --locked --package ritornel-server --no-default-features --doc

  player-arm64:
    # The headless player, as it is built for a small arm64 board: the
    # server with its audio output alone, which links ALSA, and no media
    # session or Last.fm. GitHub's arm64 runner builds it natively, which is
    # simpler than cross-linking ALSA, and runs the engine's and the
    # server's tests on arm64. The last step prints the release build's
    # size and the server's memory at idle. The full tier alone runs it.
    name: Player on arm64 Linux
    needs: changes
    if: needs.changes.outputs.workspace == 'true' && needs.changes.outputs.tier == 'full'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          packages: pkg-config libasound2-dev
          rust-cache: crates
      - run: cargo clippy --locked --package ritornel-server --no-default-features --features audio-output --all-targets -- -D warnings
      - run: cargo nextest run --locked --package ritornel-engine --package ritornel-server --no-default-features --features ritornel-server/audio-output
      - run: cargo test --locked --package ritornel-engine --package ritornel-server --no-default-features --features ritornel-server/audio-output --doc
      - run: cargo build --locked --release --package ritornel-server --no-default-features --features audio-output
      - run: cargo build --locked --release --package ritornelctl
      - run: scripts/player-footprint.sh target/release

  passed:
    # The one check for branch protection to require: it passes only when
    # every job above passed, or was skipped because the changes job said
    # it was not needed, for the change or the tier. A job added above goes
    # in this list and, if it is one the changes job can skip, in the
    # condition below.
    name: CI passed
    # Not in a run a newer one cancelled: its jobs say cancelled, and
    # failing here as well would mark the commit failed, though the newer
    # run tests the same commit. On a stacked PR one push to the stack is
    # two events, one for the PR's base and one for its head.
    if: ${{ !cancelled() }}
    needs: [changes, checks, workspace, desktop, hub, player-arm64]
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - if: >-
          needs.changes.result != 'success' || needs.checks.result != 'success' ||
          (needs.changes.outputs.workspace != 'false' && (needs.workspace.result != 'success' || needs.hub.result != 'success')) ||
          (needs.changes.outputs.workspace != 'false' && needs.changes.outputs.tier != 'linux' && needs.player-arm64.result != 'success') ||
          (needs.changes.outputs.desktop != 'false' && needs.desktop.result != 'success') ||
          contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

  prune-caches:
    # On main, once every job has saved its cache: deletes each cache on main
    # that a newer one of the same kind replaced, such as the whole set saved
    # before Cargo.lock last changed. A PR restores the newest of a kind
    # when its own key is not found, so nothing restores the older ones, and
    # left to the quota they would evict newer caches instead.
    name: Prune replaced caches
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    needs: [checks, workspace, desktop, hub, player-arm64]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          declare -A kept
          gh api --paginate "repos/$GH_REPO/actions/caches?ref=refs/heads/main&per_page=100" \
            --jq '.actions_caches[] | "\(.created_at) \(.id) \(.key)"' |
            sort -r |
            while read -r created id key; do
              # The key without the hashes at its end: the kind of cache.
              kind=$(sed -E 's/(-p[0-9]+)?(-[0-9a-f]{8,})+$//' <<<"$key")
              if [[ -n ${kept[$kind]:-} ]]; then
                echo "deleting $key, saved $created: ${kept[$kind]} replaced it"
                gh api --method DELETE "repos/$GH_REPO/actions/caches/$id" > /dev/null
              else
                kept[$kind]=$key
              fi
            done
