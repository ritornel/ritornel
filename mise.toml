# The Rust pin is rust-toolchain.toml. This file lists no Rust, because an
# entry here would override that file, and the setting below is what makes
# mise read it. See "Workspace and tooling" in docs/internals/server.md.
[settings]
idiomatic_version_file_enable_tools = ["rust"]

[tools]
# Runs the checks in scripts/ (`deps`, `sleeps`, `build-version`, `contract-version`, `docs`),
# the same code on macOS, Linux and Windows.
python = "3.15.1"
# For making the audio fixtures again, and the tones `scripts/desktop.sh
# tones` plays. No aqua package provides ffmpeg; conda-forge builds it for
# macOS and Linux.
"conda:ffmpeg" = "9.0.2"
# Checks every dependency's licence against deny.toml.
"aqua:EmbarkStudios/cargo-deny" = "0.21.0"
# Runs the tests, each in a process of its own, all binaries at once.
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.151"

[tasks.build]
description = "Build every crate and both programs, and on macOS and Linux the desktop app"
run = ["cargo build --locked --workspace --all-targets", { task = "desktop:app" }]

[tasks.install]
description = "Build in release and install it: the programs in ~/.local/bin, and the app with its own server, on a Mac Ritornel.app in /Applications and on Linux ~/.local/lib/ritornel with a launcher entry"
run = [
    "cargo build --locked --release --package ritornel-server --package ritornelctl",
    { task = "desktop:app" },
    "scripts/install.sh",
]

[tasks.check]
description = "Run everything CI runs"
run = [
    { task = "fmt" },
    { task = "deps" },
    { task = "sleeps" },
    { task = "build-version" },
    { task = "contract-version" },
    { task = "docs" },
    { task = "licenses" },
    { task = "lint" },
    { task = "test" },
    { task = "desktop:check" },
]

[tasks.fmt]
description = "Check formatting"
run = "cargo fmt --all --check"

[tasks.deps]
description = "Check that dependencies point one way"
run = "python scripts/check-deps.py"

[tasks.sleeps]
description = "Check that every sleep in a test says why no event will do"
run = "python scripts/check-test-sleeps.py"

[tasks.build-version]
description = "Check package versions and release tags"
run = "python scripts/check-build-version.py"

[tasks.contract-version]
description = "Check that a change to the contract raises its version once, against main's"
run = ["python scripts/check-contract-tests.py", "python scripts/check-contract.py"]

[tasks.docs]
description = "Check docs/internals citations, doc rules and rustdoc intra-doc links"
run = ["python scripts/check-docs.py", { task = "rustdoc" }]

# Each system documents its own platform code, so CI runs this on each.
[tasks.rustdoc]
description = "Check rustdoc intra-doc links"
run = "cargo doc --locked --workspace --no-deps --all-features --document-private-items"
env = { RUSTDOCFLAGS = "-D rustdoc::broken_intra_doc_links" }

[tasks.licenses]
description = "Check that every dependency's licence allows the app's, in the main workspace and the desktop app's"
run = [
    "cargo deny --manifest-path Cargo.toml --config deny.toml check licenses",
    "cargo deny --manifest-path apps/desktop/Cargo.toml --config deny.toml check licenses",
]

[tasks.lint]
description = "Run clippy with warnings denied, on the server with and without Last.fm"
run = [
    "cargo clippy --locked --workspace --all-targets --all-features -- -D warnings",
    # The server as the headless hub is built: without Last.fm, with MusicBrainz.
    "cargo clippy --locked --package ritornel-server --no-default-features --features musicbrainz --all-targets -- -D warnings",
    # And with no plugin at all, which a server may still be built as.
    "cargo clippy --locked --package ritornel-server --no-default-features --all-targets -- -D warnings",
]

[tasks.test]
description = "Run the tests"
run = [
    "cargo nextest run --locked --workspace --all-features",
    # nextest runs no doc tests.
    "cargo test --locked --workspace --all-features --doc",
]

[tasks.schema]
description = "Write the schema snapshots in schema/ again from the migrations"
run = "cargo test --locked --package ritornel-engine schema_snapshot"
env = { RITORNEL_BLESS = "1" }

[tasks.contract]
description = "Write contract/contract.ts again from the Rust contract"
run = "cargo test --locked --package ritornel-contract typescript"
env = { RITORNEL_BLESS = "1" }

# The desktop app, in GPUI, is a Cargo workspace of its own in apps/desktop,
# checked and built on macOS, Linux and Windows: on a Linux machine without
# the libraries it links, these say so and do nothing. See scripts/desktop.sh,
# and on Windows scripts/desktop.ps1, which `desktop:check` runs there.
[tasks."desktop:check"]
description = "Check, lint and test the desktop app"
run = "scripts/desktop.sh check"
run_windows = "pwsh -NoProfile -File scripts/desktop.ps1 check"

[tasks."desktop:release"]
description = "Build the desktop app in release"
run = "scripts/desktop.sh release"
run_windows = "pwsh -NoProfile -File scripts/desktop.ps1 release"

[tasks."desktop:run"]
description = "Run the desktop app against an invented library, never a real one"
run = "scripts/desktop.sh run"

[tasks."desktop:app"]
description = "Build Ritornel.app, with its own server, or on Linux a folder of the two"
run = "scripts/desktop.sh app"
